name: Verify G-Bot frontend and desktop
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:desktop
      - run: npm run test:production
      - run: npm run security:scan
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
      - run: npm run test:electron
      - run: npm run desktop:dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: node scripts/smoke-electron.mjs --packaged
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: G-Bot-Windows-owner-test
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-review-${{ matrix.os }}
          path: test-results-electron/
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: gbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run actual PostgreSQL RLS, lifecycle and revocation tests
        env:
          PGPASSWORD: local-ci-only
        run: |
          psql -h localhost -U postgres -d gbot_test -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do psql -h localhost -U postgres -d gbot_test -v ON_ERROR_STOP=1 -f "$migration"; done
          psql -h localhost -U postgres -d gbot_test -v ON_ERROR_STOP=1 -f supabase/tests/authorization.sql
