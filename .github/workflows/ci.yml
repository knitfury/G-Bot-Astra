name: Verify G-Bot frontend and desktop
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:desktop
      - run: npm run test:production
      - run: npm run security:scan
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
      - run: npm run test:electron
      - name: Package unconfigured smoke-test fixture
        run: npm run desktop:dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: node scripts/smoke-electron.mjs --packaged
      # Public repository variables only; never attach this job to release-signing.
      # Keep the unconfigured packaged smoke fixture above unchanged.
      - name: Package configured unsigned owner-test installer
        if: vars.GBOT_OWNER_TEST_ENABLED == 'true'
        shell: bash
        run: |
          node --import tsx scripts/validate-owner-test-config.ts
          npm run desktop:build
          node --import tsx scripts/validate-owner-test-config.ts --bundle
          npx electron-builder --publish never --config.directories.output=release-owner-test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GBOT_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_GBOT_ENVIRONMENT }}
          GBOT_CONTROL_PLANE_URL: ${{ vars.GBOT_CONTROL_PLANE_URL }}
          GBOT_LICENSE_PUBLIC_KEYS: ${{ vars.GBOT_LICENSE_PUBLIC_KEYS }}
          GBOT_CATALOG_PUBLIC_KEYS: ${{ vars.GBOT_CATALOG_PUBLIC_KEYS }}
          GBOT_UPDATE_PUBLIC_KEYS: ${{ vars.GBOT_UPDATE_PUBLIC_KEYS }}
          GBOT_RELEASE_MANIFEST_URL: ${{ vars.GBOT_RELEASE_MANIFEST_URL }}
          GBOT_SENTRY_DSN: ${{ vars.GBOT_SENTRY_DSN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Explain disabled owner-test artifact
        if: vars.GBOT_OWNER_TEST_ENABLED != 'true'
        run: node -e "console.log('::notice::Configured owner-test installer not produced. Set repository Actions variable GBOT_OWNER_TEST_ENABLED=true and the required public variables. Smoke-test fixtures are not account-test installers.')"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest' && vars.GBOT_OWNER_TEST_ENABLED == 'true'
        with:
          name: G-Bot-Windows-owner-test
          path: |
            release-owner-test/*.exe
            release-owner-test/*.blockmap
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest' && vars.GBOT_OWNER_TEST_ENABLED == 'true'
        with:
          name: G-Bot-macOS-owner-test
          path: |
            release-owner-test/*.dmg
            release-owner-test/*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-review-${{ matrix.os }}
          path: test-results-electron/
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: gbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run actual PostgreSQL RLS, lifecycle and revocation tests
        env:
          PGPASSWORD: local-ci-only
        run: |
          psql -h localhost -U postgres -d gbot_test -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do psql -h localhost -U postgres -d gbot_test -v ON_ERROR_STOP=1 -f "$migration"; done
          psql -h localhost -U postgres -d gbot_test -v ON_ERROR_STOP=1 -f supabase/tests/authorization.sql
